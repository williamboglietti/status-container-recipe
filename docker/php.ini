expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 8M
post_max_size = 10M
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax
