name: Build and validate recipe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
    # The resolve step matches this exact expression to refresh Composer dependencies daily.
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh dependencies and rebuild, even without a source change
        type: boolean
        default: true

# No public image is published. A maintainer-only publisher may write to a
# private, unlinked GHCR package after both native architectures pass.
permissions:
  contents: read

env:
  PRIVATE_IMAGE: ghcr.io/williamboglietti/status-v3

# Source resolution, tests and lock recording form one transaction.
concurrency:
  group: recipe-validation
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: >-
      github.repository == 'williamboglietti/status-v3' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      build_required: ${{ steps.receipt.outputs.build_required }}
      fingerprint: ${{ steps.sources.outputs.fingerprint }}
      app_ref: ${{ steps.sources.outputs.app_ref }}
      core_ref: ${{ steps.sources.outputs.core_ref }}
      frankenphp_image: ${{ steps.sources.outputs.frankenphp_image }}
      composer_image: ${{ steps.sources.outputs.composer_image }}
      force_rebuild: ${{ steps.sources.outputs.force_rebuild }}
    steps:
      - name: Check out image recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx for the resolver toolchain
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve upstream sources, dependencies and base digests
        id: sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_UPDATE: ${{ inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          flags=()
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            flags+=(--force)
          fi
          if [[ "$EVENT_NAME" == "push" || "$FORCE_UPDATE" == "true" || "$EVENT_SCHEDULE" == "43 3 * * *" ]]; then
            flags+=(--refresh-dependencies)
          fi
          python3 scripts/resolve.py "${flags[@]}"

      - name: Decide whether candidate locks need a new validation
        id: receipt
        env:
          SOURCE_CHANGED: ${{ steps.sources.outputs.changed }}
          FORCE_UPDATE: ${{ inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          required = (os.environ['SOURCE_CHANGED'] == 'true' or
                      os.environ['FORCE_UPDATE'] == 'true' or
                      os.environ['EVENT_NAME'] in ('push', 'pull_request', 'workflow_dispatch'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_required=' + str(required).lower() + '\n')
          PYTHON

      - name: Prepare locked app source
        if: steps.receipt.outputs.build_required == 'true'
        run: python3 scripts/prepare-source.py

      - name: Share only reproducible source locks
        if: steps.receipt.outputs.build_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-lock
          path: |
            sources.lock.json
            composer.lock
          if-no-files-found: error
          retention-days: 14

  private-package:
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish_enabled: ${{ steps.prepare.outputs.publish_enabled }}
      previous_image: ${{ steps.prepare.outputs.previous_image }}
    steps:
      - name: Check out the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx for a private package bootstrap
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify private GHCR readiness and previous image
        id: prepare
        env:
          STATUS_V3_GHCR_TOKEN: ${{ secrets.STATUS_V3_GHCR_TOKEN }}
          STATUS_V3_GHCR_USERNAME: williamboglietti
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/private_image.py prepare

      - name: Remove bootstrap registry credentials
        if: always()
        run: docker logout ghcr.io || true

  build-test:
    needs: [resolve, private-package]
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.build_required == 'true' &&
      (needs.private-package.result == 'success' || needs.private-package.result == 'skipped' ||
       needs.private-package.result == 'failure')
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out tested recipe revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download resolved locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resolved-lock

      - name: Prepare exact locked app source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prepare-source.py

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to pull the previous private image
        if: needs.private-package.outputs.publish_enabled == 'true' && needs.private-package.outputs.previous_image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: williamboglietti
          password: ${{ secrets.STATUS_V3_GHCR_TOKEN }}

      - name: Pull the previous image for migration tests
        if: needs.private-package.outputs.publish_enabled == 'true' && needs.private-package.outputs.previous_image != ''
        env:
          PREVIOUS_IMAGE: ${{ needs.private-package.outputs.previous_image }}
        run: |
          echo "::add-mask::$PREVIOUS_IMAGE"
          docker pull "$PREVIOUS_IMAGE"
          docker logout ghcr.io

      # Dockerfile also gates the build with composer audit --locked --no-dev.
      - name: Build once and load the candidate to test
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          FRANKENPHP_IMAGE: ${{ needs.resolve.outputs.frankenphp_image }}
          COMPOSER_IMAGE: ${{ needs.resolve.outputs.composer_image }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          APP_REF: ${{ needs.resolve.outputs.app_ref }}
          CORE_REF: ${{ needs.resolve.outputs.core_ref }}
          FORCE_REBUILD: ${{ needs.resolve.outputs.force_rebuild }}
        run: |
          flags=()
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            flags+=(--no-cache)
          fi
          docker buildx build --load --pull \
            --platform "linux/$ARCHITECTURE" \
            --tag status-v3:test \
            --build-arg "FRANKENPHP_IMAGE=$FRANKENPHP_IMAGE" \
            --build-arg "COMPOSER_IMAGE=$COMPOSER_IMAGE" \
            --build-arg "CACHET_APP_REF=$APP_REF" \
            --build-arg "CACHET_CORE_REF=$CORE_REF" \
            --build-arg "SOURCE_FINGERPRINT=$FINGERPRINT" \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$FINGERPRINT" \
            "${flags[@]}" .

      - name: Test the image contract on SQLite
        env:
          PREVIOUS_IMAGE: ${{ needs.private-package.outputs.previous_image }}
        run: |
          flags=()
          if [[ -n "$PREVIOUS_IMAGE" ]]; then flags+=(--previous "$PREVIOUS_IMAGE"); fi
          python3 test/test-image.py --image status-v3:test "${flags[@]}"

      - name: Keep the isolated functional test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-test-report-${{ matrix.architecture }}
          path: .build/test-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify role healthchecks and a killed worker with Compose
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 test/test-healthcheck.py --image status-v3:test --platform "linux/$ARCHITECTURE"

      - name: Test PostgreSQL, MySQL and MariaDB backends
        env:
          PREVIOUS_IMAGE: ${{ needs.private-package.outputs.previous_image }}
        run: |
          flags=()
          if [[ -n "$PREVIOUS_IMAGE" ]]; then flags+=(--previous "$PREVIOUS_IMAGE"); fi
          for database in pgsql mysql mariadb; do
            python3 test/test-database.py --image status-v3:test --database "$database" "${flags[@]}"
          done

      - name: Keep the database test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-test-reports-${{ matrix.architecture }}
          path: .build/database-*-test-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Run docker-compose.yml end to end
        run: python3 test/test-compose.py --image status-v3:test

      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: false

      - name: Reject fixable HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: status-v3:test
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: .build/trivy.json
          skip-setup-trivy: true

      - name: Keep the vulnerability report, including failed checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-report-${{ matrix.architecture }}
          path: .build/trivy.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to publish the tested private candidate
        if: needs.private-package.outputs.publish_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: williamboglietti
          password: ${{ secrets.STATUS_V3_GHCR_TOKEN }}

      - name: Push exactly the locally tested image
        if: needs.private-package.outputs.publish_enabled == 'true'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
        run: |
          echo "::add-mask::$PRIVATE_IMAGE"
          candidate="$PRIVATE_IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE"
          docker tag status-v3:test "$candidate"
          docker push "$candidate"
          mkdir -p .build/digests
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' \
            > .build/candidate-manifest.json
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          manifest = json.loads(pathlib.Path('.build/candidate-manifest.json').read_text())
          digest = manifest['digest']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Candidate digest is not a SHA256 manifest reference.')
          architecture = os.environ['ARCHITECTURE']
          receipt = {'architecture': architecture, 'digest': digest,
                     'fingerprint': os.environ['FINGERPRINT'], 'revision': os.environ['GITHUB_SHA']}
          pathlib.Path('.build/digests/' + architecture + '.json').write_text(json.dumps(receipt) + '\n')
          PYTHON

      - name: Share the tested candidate digest
        if: needs.private-package.outputs.publish_enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-digest-${{ matrix.architecture }}
          path: .build/digests/${{ matrix.architecture }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  record-locks:
    needs: [resolve, build-test]
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      main_sha: ${{ steps.record.outputs.main_sha }}
    steps:
      - name: Check out the source revision tested by both architectures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download resolved locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resolved-lock

      - name: Record only validated source and dependency locks
        id: record
        env:
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'main changed during testing; refusing stale lock update.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sources.lock.json composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: update validated Cachet sources ${FINGERPRINT:0:12}"
            git push origin HEAD:main
          fi
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'Recipe validated. Private image publication, if enabled, is handled separately after both architectures pass.' >> "$GITHUB_STEP_SUMMARY"

  publish-private-image:
    needs: [resolve, private-package, build-test, record-locks]
    if: >-
      needs.resolve.outputs.build_required == 'true' &&
      needs.private-package.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download resolved locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resolved-lock

      - name: Download only tested candidate receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-digest-*
          path: .build/digests
          merge-multiple: true

      - name: Set up Buildx for private manifest promotion
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR for private promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: williamboglietti
          password: ${{ secrets.STATUS_V3_GHCR_TOKEN }}

      - name: Recheck private package and tested main revision
        env:
          STATUS_V3_GHCR_TOKEN: ${{ secrets.STATUS_V3_GHCR_TOKEN }}
          EXPECTED_MAIN_SHA: ${{ needs.record-locks.outputs.main_sha }}
        run: |
          python3 scripts/private_image.py verify
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$EXPECTED_MAIN_SHA" ]]; then
            echo 'main changed after validation; refusing private image promotion.' >&2
            exit 1
          fi

      - name: Promote exactly the tested digests into the private package
        env:
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          PRIVATE_IMAGE: ${{ env.PRIVATE_IMAGE }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import subprocess

          fingerprint = os.environ['FINGERPRINT']
          if not re.fullmatch(r'[0-9a-f]{64}', fingerprint):
              raise SystemExit('Resolver fingerprint must be a SHA256 value.')
          references = []
          for architecture in ('amd64', 'arm64'):
              receipt_path = pathlib.Path('.build/digests') / f'{architecture}.json'
              receipt = json.loads(receipt_path.read_text())
              if (receipt.get('architecture') != architecture or
                      receipt.get('fingerprint') != fingerprint or
                      receipt.get('revision') != os.environ['GITHUB_SHA'] or
                      not re.fullmatch(r'sha256:[0-9a-f]{64}', receipt.get('digest', ''))):
                  raise SystemExit(f'Invalid tested candidate receipt for {architecture}.')
              references.append(os.environ['PRIVATE_IMAGE'] + '@' + receipt['digest'])
          unique = (os.environ['PRIVATE_IMAGE'] + ':build-' + fingerprint[:16] + '-' +
                    os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          subprocess.run([
              'docker', 'buildx', 'imagetools', 'create', '--tag', unique,
              '--tag', os.environ['PRIVATE_IMAGE'] + ':v3',
              '--tag', os.environ['PRIVATE_IMAGE'] + ':latest', *references,
          ], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\nPublished a private multi-architecture image after both test jobs passed.\n')
              summary.write('No public image was pushed and no server was changed.\n')
          PYTHON

      - name: Remove private registry credentials
        if: always()
        run: docker logout ghcr.io || true
